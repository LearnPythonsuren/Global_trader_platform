[project]
name = "global-trader-platform"
version = "0.1.0"
description = "Market intelligence platform for traders and algo developers, built on Global Datafeeds price, fundamental, mutual fund and news APIs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
gtp = "gtp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gtp*"]

[tool.setuptools.package-data]
gtp = ["web/**/*"]

# Vercel: which ASGI app to serve (https://vercel.com/docs/frameworks/backend/fastapi)
[tool.vercel]
entrypoint = "gtp.asgi:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"gtp/gdf/demo.py" = ["E501"]   # reference tables read better one row per line
