<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Global Trader Platform — a market intelligence terminal for Indian equities, derivatives, mutual funds and news.">
<meta name="color-scheme" content="dark light">
<title>Global Trader Terminal</title>
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="preload" href="/static/fonts/plex-mono-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/styles.css">
<script type="module" src="/static/app.js"></script>
</head>
<body>
<div id="boot" class="boot"><div class="boot-mark">▲</div><div class="boot-text">Loading terminal…</div></div>
<div id="app" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">▲</span>
      <span class="brand-name">Global Trader<span class="brand-sub">Terminal</span></span>
      <span id="mode-badge" class="badge"></span>
    </div>
    <div id="tape" class="tape" aria-label="Market tape"></div>
    <div class="top-actions">
      <button id="cmd-trigger" class="cmd-trigger" title="Search & commands (Ctrl/⌘ K)">
        <span class="cmd-ico"></span><span class="cmd-label">Search</span><kbd>⌘K</kbd>
      </button>
      <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme"></button>
      <button id="account-btn" class="pill-btn" title="Account & API"></button>
    </div>
  </header>
  <div class="shell">
    <nav id="rail" class="rail" aria-label="Primary"></nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>
</body>
</html>
