<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Global Trader Platform — admin console for issuing and managing customer API keys.">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<title>GTP Admin · Customer Keys</title>
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="preload" href="/static/fonts/plex-mono-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/styles.css">
<script type="module" src="/static/admin.js"></script>
<style>
  body { background: var(--bg); }
  .adm-wrap { max-width: 1120px; margin: 0 auto; padding: 22px 16px 80px; }
  .adm-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .adm-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .2px; }
  .adm-brand .mk { color: var(--accent); font-size: 20px; }
  .adm-brand small { font-weight: 500; color: var(--faint); letter-spacing: .3px; }
  .adm-gate { max-width: 440px; margin: 10vh auto 0; }
  .adm-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field label { font-size: 12px; color: var(--faint); letter-spacing: .3px; }
  .keybox { margin-top: 12px; border: 1px solid var(--accent); border-radius: var(--radius-sm); background: color-mix(in srgb, var(--accent) 9%, transparent); padding: 12px 14px; }
  .keybox .k { font-family: var(--mono); font-size: 14px; word-break: break-all; color: var(--text); }
  .usage-cell { background: var(--panel-2); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border); }
  .pill.on { color: var(--up); border-color: color-mix(in srgb, var(--up) 45%, var(--border)); }
  .pill.off { color: var(--down); border-color: color-mix(in srgb, var(--down) 45%, var(--border)); }
  .adm-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .adm-toast > div { background: var(--elevated, var(--panel)); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow); padding: 10px 16px; font-size: 13px; }
  .adm-toast .bad { border-color: color-mix(in srgb, var(--down) 55%, var(--border)); }
  .adm-toast .good { border-color: color-mix(in srgb, var(--up) 55%, var(--border)); }
  .inline-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  @media (min-width: 720px) { .create-row { display: grid; grid-template-columns: 1.3fr 1.6fr 1fr auto; gap: 10px; align-items: end; } }
</style>
</head>
<body>
<div id="admin" class="adm-wrap"><div class="empty"><span class="spinner"></span></div></div>
<div id="toast" class="adm-toast" aria-live="polite"></div>
</body>
</html>
